name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The jobs need no write scope, and no git credentials once checked out: the
# self-hosted VM runs the branch's own test code.
permissions:
  contents: read

# An allowlist: a push, a manual dispatch, or a PR from a branch of this repo runs
# on tart-ci, the on-demand Tart VM runner on the maintainer's Mac (Xcode 26.5,
# macOS Tahoe). Anything else — a fork's PR, a PR whose head repo was deleted
# (null), any event added later — goes to the hosted runner, because
# tart-ci-demand never boots a VM for a fork job. The PR test compares the head
# repo's identity rather than its `fork` flag.
#
# That expression is not a security boundary: a fork can rewrite this file and
# ask for the tart labels directly. The boundary is the repo's fork-PR approval
# policy (all_external_contributors, which tart-ci-demand enforces). Before
# approving a fork run, check its diff under .github/ for a changed runs-on.
#
# The runner expression is defined once, on test-macos, and reused by anchor.
jobs:
  test-macos:
    name: macOS Tests
    runs-on: &runner ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","macOS","arm64","tart"]') || fromJSON('["macos-15"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run SatiTests on macOS
        run: |
          xcodebuild test \
            -project Sati/Sati.xcodeproj \
            -scheme Sati \
            -destination 'platform=macOS' \
            -only-testing:SatiTests \
            -resultBundlePath TestResults/macos.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

  test-ios:
    name: iOS Tests
    runs-on: *runner
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run SatiTests on iOS Simulator
        run: |
          # Prefers the tart-ci image's iPhone 17 Pro, which has done its first boot.
          DEVICE_ID=$(scripts/ci/pick-simulator iOS iPhone "iPhone 17 Pro")
          xcodebuild test \
            -project Sati/Sati.xcodeproj \
            -scheme Sati \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:SatiTests \
            -resultBundlePath TestResults/ios.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

  test-watchos:
    name: watchOS Tests
    runs-on: *runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run SatiWatchTests on watchOS Simulator
        run: |
          DEVICE_ID=$(scripts/ci/pick-simulator watchOS Watch)
          xcodebuild test \
            -project Sati/Sati.xcodeproj \
            -scheme SatiWatch \
            -destination "platform=watchOS Simulator,id=$DEVICE_ID" \
            -only-testing:SatiWatchTests \
            -resultBundlePath TestResults/watchos.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""
